services:
  # ── Backend Web Service (FastAPI) ──────────────────────────────────────────
  - type: web
    name: bloomai-backend
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: .
      - key: AI_MODEL
        value: gemini-2.5-flash
      - key: AI_ENABLED
        value: "true"
      - key: AI_TIMEOUT_SECONDS
        value: "10"
      - key: GEMINI_API_KEY
        sync: false

  # ── Frontend Static Site (React + Vite) ───────────────────────────────────
  - type: web
    name: bloomai-frontend
    runtime: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_MODE
        value: real
      - key: VITE_API_BASE
        fromService:
          type: web
          name: bloomai-backend
          property: host
